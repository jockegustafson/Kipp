[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kipp"
version = "1.0.0"
description = "Kipp: audible in-breaths and disfluent breaths in Swedish speech"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "soundfile", "torch>=2.0", "transformers>=4.30"]

[project.optional-dependencies]
vad = ["silero-vad"]

[project.scripts]
kipp = "kipp.cli:main"

[tool.setuptools]
packages = ["kipp"]

[tool.setuptools.package-data]
kipp = ["weights/*.npz", "weights/*.json"]
