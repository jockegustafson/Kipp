[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kipp"
version = "1.2.1"
description = "Kipp: breaths in Swedish speech (detector) and where a speaker breathes in a text (lung model)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "soundfile", "torch>=2.0", "transformers>=4.30"]

[project.optional-dependencies]
vad = ["silero-vad"]

[project.scripts]
kipp = "kipp.cli:main"
kipp-plan = "kipp.lung:main"
kipp-demo = "kipp.demo:main"

[tool.setuptools]
packages = ["kipp"]

[tool.setuptools.package-data]
kipp = ["weights/*.npz", "weights/*.json", "demo.html"]
